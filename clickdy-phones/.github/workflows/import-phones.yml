name: Import phones (automatic)

on:
  schedule:
    - cron: "11 */6 * * *"     # 4 times a day: adds new phones, back-fills old ones, refreshes edits
  workflow_dispatch:           # lets you start it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: import-phones
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import phones from Wikipedia
        env:
          PHONES_MAX_PER_RUN: "1000"
        run: python scripts/import_wikipedia_phones.py
      - name: Build the phones section
        run: python scripts/build_phones.py
      - name: Save everything
        run: |
          git config user.name "clickdy-news-bot"
          git config user.email "clickdy-news-bot@users.noreply.github.com"
          git add -A phones-data data phones assets/phones.css assets/phones.js sitemap-phones.xml
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "chore: import and rebuild phones"
            git pull --rebase
            git push
          fi
