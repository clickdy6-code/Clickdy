name: Fetch news drafts

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours, 24/7 (change "*/2" to "*/1" for hourly)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect news and write drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # optional backup
        run: python scripts/fetch_news.py
      - name: Save drafts to the repo
        run: |
          git config user.name "clickdy-news-bot"
          git config user.email "clickdy-news-bot@users.noreply.github.com"
          git add drafts data
          if git diff --cached --quiet; then
            echo "No new drafts."
          else
            git commit -m "chore: new news drafts"
            git pull --rebase
            git push
          fi
