name: Build phones

on:
  push:
    paths:
      - "phones-data/**"
      - "assets/phones/**"
      - "scripts/phones_lib.py"
      - "scripts/build_phones.py"
      - "scripts/build_blog.py"
      - "scripts/common.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-phones
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate the phones section
        run: python scripts/build_phones.py
      - name: Save generated pages
        run: |
          git config user.name "clickdy-news-bot"
          git config user.email "clickdy-news-bot@users.noreply.github.com"
          git add -A phones assets/phones.css assets/phones.js sitemap-phones.xml
          if git diff --cached --quiet; then
            echo "Nothing to update."
          else
            git commit -m "chore: rebuild phones"
            git pull --rebase
            git push
          fi
